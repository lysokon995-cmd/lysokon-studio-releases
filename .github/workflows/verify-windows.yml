name: Verify Windows installer
run-name: Windows ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release tag to verify
        required: true
        type: string
      inference:
        description: Download Qwen3.5 2B and run actual CPU inference
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: windows-installer-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  installed-app:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Initialize isolated verification paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $smokeRoot = Join-Path $env:RUNNER_TEMP 'lysokon-smoke'
          $modelCache = Join-Path $smokeRoot 'profile/AI/Models'
          New-Item -ItemType Directory -Force -Path $smokeRoot | Out-Null
          "SMOKE_ROOT=$smokeRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "INSTALL_DIRECTORY=$(Join-Path $env:LOCALAPPDATA 'Programs/Lysokon Planner тест')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MODEL_CACHE=$modelCache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # The release repository contains this workflow and release assets only.
      # No private application source is checked out or copied to this runner.
      - name: Download the selected draft installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REPOSITORY -ne 'lysokon995-cmd/lysokon-studio-releases') { throw 'Unexpected release repository.' }
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9.-]+)?$') { throw 'Invalid release tag.' }
          New-Item -ItemType Directory -Force -Path $env:SMOKE_ROOT | Out-Null
          $release = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json tagName,isDraft,assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.tagName -ne $env:RELEASE_TAG -or -not $release.isDraft) { throw 'The requested draft release does not exist.' }
          $asset = @($release.assets | Where-Object { $_.name -eq 'Novy-Setup.exe' })
          if ($asset.Count -ne 1) { throw 'Draft must contain exactly one Novy-Setup.exe installer.' }
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern 'Novy-Setup.exe' --dir $env:SMOKE_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'Installer download failed.' }
          $installer = Join-Path $env:SMOKE_ROOT 'Novy-Setup.exe'
          if ((Get-Item $installer).Length -lt 10000000) { throw 'Installer is unexpectedly small.' }
          $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          @{ tag = $env:RELEASE_TAG; sha256 = $hash; size = (Get-Item $installer).Length } | ConvertTo-Json | Set-Content (Join-Path $env:SMOKE_ROOT 'installer-sha256.json')
          # Verify the ordinary upgrade path from the latest published build.
          $releases = @(gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName,isDraft,isPrerelease | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect previous published release.' }
          $previous = $releases | Where-Object { -not $_.isDraft -and -not $_.isPrerelease } | Select-Object -First 1
          if ($previous) {
            if ($previous.tagName -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$' -or $previous.tagName -eq $env:RELEASE_TAG) { throw 'Unexpected predecessor tag.' }
            $directory = Join-Path $env:SMOKE_ROOT 'previous'
            New-Item -ItemType Directory -Force -Path $directory | Out-Null
            gh release download $previous.tagName --repo $env:GITHUB_REPOSITORY --pattern 'Novy-Setup.exe' --dir $directory
            if ($LASTEXITCODE -ne 0) { throw 'Previous installer download failed.' }
            "PREVIOUS_INSTALLER=$(Join-Path $directory 'Novy-Setup.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "PREVIOUS_TAG=$($previous.tagName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Restore only the local model cache
        if: ${{ inputs.inference }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4, verified from official actions/cache
        with:
          path: ${{ env.MODEL_CACHE }}
          key: windows-x64-ollama-qwen3.5-2b-q4_K_M-v1

      - name: Create real prior-version data for the upgrade check
        if: ${{ env.PREVIOUS_INSTALLER != '' }}
        shell: pwsh
        env:
          CI: 'true'
          LYSOKON_SMOKE_INFERENCE: '0'
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item Env:GH_TOKEN, Env:GITHUB_TOKEN -ErrorAction SilentlyContinue
          $installer = Start-Process -FilePath $env:PREVIOUS_INSTALLER -ArgumentList '/S', "/D=$env:INSTALL_DIRECTORY" -PassThru
          if (-not $installer.WaitForExit(180000)) { $installer.Kill($true); throw 'Previous installation timed out.' }
          if ($installer.ExitCode -ne 0) { throw 'Previous installation failed.' }
          Get-Process -Name Novy -ErrorAction SilentlyContinue | Stop-Process -Force
          $executables = @(Get-ChildItem -LiteralPath (Join-Path $env:LOCALAPPDATA 'Programs') -Recurse -Filter 'Novy.exe' -File)
          if ($executables.Count -ne 1) { throw 'Expected one previous application.' }
          # The prior build also enforces chat readiness. Its no-inference smoke
          # must receive the same verified weights as the new profile.
          $priorModels = Join-Path $env:SMOKE_ROOT 'previous/profile/AI/Models'
          New-Item -ItemType Directory -Force -Path $priorModels | Out-Null
          if (-not (Test-Path $env:MODEL_CACHE)) { throw 'The predecessor chat check requires the restored model cache.' }
          Get-ChildItem -LiteralPath $env:MODEL_CACHE -Force | Copy-Item -Destination $priorModels -Recurse -Force
          $env:LYSOKON_SMOKE_REPORT = Join-Path $env:SMOKE_ROOT 'previous/report.json'
          $process = Start-Process -FilePath $executables[0].FullName -ArgumentList '--smoke-test', '--enable-logging=stderr' -PassThru -RedirectStandardOutput (Join-Path $env:SMOKE_ROOT 'previous/stdout.log') -RedirectStandardError (Join-Path $env:SMOKE_ROOT 'previous/stderr.log')
          if (-not $process.WaitForExit(180000)) { $process.Kill($true); throw 'Previous application check timed out.' }
          if ($process.ExitCode -ne 0) { if (Test-Path $env:LYSOKON_SMOKE_REPORT) { Get-Content -Raw $env:LYSOKON_SMOKE_REPORT }; throw 'Previous application could not save its test data.' }
          $prior = Get-Content -Raw $env:LYSOKON_SMOKE_REPORT | ConvertFrom-Json
          if (-not $prior.ok) { throw 'Previous application smoke failed.' }
          $oldProfile = Join-Path $env:SMOKE_ROOT 'previous/profile'
          $newProfile = Join-Path $env:SMOKE_ROOT 'profile'
          New-Item -ItemType Directory -Force -Path $newProfile | Out-Null
          # Both paths are isolated CI profiles, never a real user's data.
          Copy-Item -LiteralPath (Join-Path $oldProfile 'tasks.json') -Destination $newProfile
          $hash = (Get-FileHash -Algorithm SHA256 (Join-Path $newProfile 'tasks.json')).Hash
          "UPGRADE_TASK_HASH=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $ai = Join-Path $newProfile 'AI'
          New-Item -ItemType Directory -Force -Path $ai | Out-Null
          $now = [DateTime]::UtcNow.ToString('o')
          @{ schemaVersion = 1; facts = @(@{ id = [Guid]::NewGuid().ToString(); text = 'CI upgrade rule: keep this preference'; createdAt = $now; updatedAt = $now }); history = @(@{ role = 'user'; content = 'CI upgrade history'; createdAt = $now }) } | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $ai 'assistant-memory.json')
          @{ notifications = $false; delivered = @('ci-upgrade'); lastWaitingReviewDay = $null } | ConvertTo-Json | Set-Content (Join-Path $newProfile 'settings.json')
          "UPGRADE_MEMORY_HASH=$((Get-FileHash -Algorithm SHA256 (Join-Path $ai 'assistant-memory.json')).Hash)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "UPGRADE_SETTINGS_HASH=$((Get-FileHash -Algorithm SHA256 (Join-Path $newProfile 'settings.json')).Hash)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LYSOKON_SMOKE_UPGRADE=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install the packaged application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item Env:GH_TOKEN, Env:GITHUB_TOKEN -ErrorAction SilentlyContinue
          # Match the updater's direct spawn, including NSIS /D as the unquoted final argument.
          # The custom path exercises spaces and Unicode on both initial install and upgrade.
          node -e "const p=require('node:child_process').spawnSync(require('node:path').join(process.env.SMOKE_ROOT,'Novy-Setup.exe'),['/S','--updated','/D='+process.env.INSTALL_DIRECTORY],{windowsVerbatimArguments:true,shell:false,windowsHide:true,timeout:180000,stdio:'inherit'});if(p.error)throw p.error;process.exit(p.status===null?1:p.status)"
          if ($LASTEXITCODE -ne 0) { throw 'Installer failed.' }
          # NSIS may launch the app at the end. Stop that fresh instance before selecting the CI profile.
          Get-Process -Name Novy -ErrorAction SilentlyContinue | Stop-Process -Force
          $programs = Join-Path $env:LOCALAPPDATA 'Programs'
          $executables = @(Get-ChildItem -LiteralPath $programs -Recurse -Filter 'Novy.exe' -File -ErrorAction SilentlyContinue)
          if ($executables.Count -ne 1) { throw "Expected one installed Novy.exe, found $($executables.Count)." }
          $exe = $executables[0].FullName
          if ($exe -ne (Join-Path $env:INSTALL_DIRECTORY 'Novy.exe')) { throw 'Installer did not preserve the requested path.' }
          $resources = Join-Path $executables[0].DirectoryName 'resources'
          if (-not (Test-Path (Join-Path $resources 'app.asar'))) { throw 'Packaged app.asar is missing.' }
          if (-not (Test-Path (Join-Path $resources 'AI/ollama.exe'))) { throw 'Bundled Ollama is missing.' }
          "INSTALLED_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $exe | Out-File (Join-Path $env:SMOKE_ROOT 'installed-path.txt')
          if ($env:UPGRADE_TASK_HASH) {
            $after = (Get-FileHash -Algorithm SHA256 (Join-Path $env:SMOKE_ROOT 'profile/tasks.json')).Hash
            if ($after -ne $env:UPGRADE_TASK_HASH) { throw 'Installer changed the prior-version task file.' }
            if ((Get-FileHash -Algorithm SHA256 (Join-Path $env:SMOKE_ROOT 'profile/AI/assistant-memory.json')).Hash -ne $env:UPGRADE_MEMORY_HASH) { throw 'Installer changed assistant memory/history.' }
            if ((Get-FileHash -Algorithm SHA256 (Join-Path $env:SMOKE_ROOT 'profile/settings.json')).Hash -ne $env:UPGRADE_SETTINGS_HASH) { throw 'Installer changed notification settings.' }
          }

      - name: Disable location only on the disposable Windows test runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Exercise real OS-denied/unavailable behavior without collecting the
          # runner's position, Google API keys, billing, or synthetic coordinates.
          $policy = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\LocationAndSensors'
          New-Item -Path $policy -Force | Out-Null
          New-ItemProperty -Path $policy -Name DisableLocation -PropertyType DWord -Value 1 -Force | Out-Null
          $service = Get-Service -Name lfsvc -ErrorAction SilentlyContinue
          if ($service) {
            Stop-Service -Name lfsvc -Force -ErrorAction Stop
            Set-Service -Name lfsvc -StartupType Disabled
          }

      - name: Launch installed build and verify actual inference
        shell: pwsh
        env:
          CI: 'true'
          LYSOKON_SMOKE_LOCATION_DENIED: '1'
          LYSOKON_SMOKE_INFERENCE: ${{ inputs.inference && '1' || '0' }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Tokens are step scoped above. Explicit removal also protects future workflow edits.
          Remove-Item Env:GH_TOKEN, Env:GITHUB_TOKEN -ErrorAction SilentlyContinue
          $env:LYSOKON_SMOKE_REPORT = Join-Path $env:SMOKE_ROOT 'report.json'
          $process = Start-Process -FilePath $env:INSTALLED_EXE -ArgumentList '--smoke-test', '--enable-logging=stderr' -PassThru -RedirectStandardOutput (Join-Path $env:SMOKE_ROOT 'stdout.log') -RedirectStandardError (Join-Path $env:SMOKE_ROOT 'stderr.log')
          $deadline = [DateTime]::UtcNow.AddMinutes(20)
          while (-not $process.HasExited -and [DateTime]::UtcNow -lt $deadline) {
            Start-Sleep -Seconds 5
            $process.Refresh()
          }
          if (-not $process.HasExited) { $process.Kill($true); throw 'Installed app smoke exceeded twenty minutes.' }
          if (-not (Test-Path $env:LYSOKON_SMOKE_REPORT)) { throw "No smoke report; app exit was $($process.ExitCode)." }
          $report = Get-Content -Raw -LiteralPath $env:LYSOKON_SMOKE_REPORT | ConvertFrom-Json
          $report.checks | Select-Object name, ok, durationMs | Format-Table -AutoSize
          if ($process.ExitCode -ne 0 -or -not $report.ok -or $report.exitCode -ne 0) { throw "Installed app verification failed (exit $($process.ExitCode))." }
          if ($env:LYSOKON_SMOKE_INFERENCE -eq '1' -and -not $report.inference) { throw 'Actual inference was not exercised.' }
          if ($env:LYSOKON_SMOKE_UPGRADE -eq '1' -and -not $report.upgrade) { throw 'Prior-version data was not verified.' }
          @{ predecessor = $env:PREVIOUS_TAG; upgrade = ($env:LYSOKON_SMOKE_UPGRADE -eq '1') } | ConvertTo-Json | Set-Content (Join-Path $env:SMOKE_ROOT 'upgrade.json')

      - name: Preserve verification report and logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, verified from official actions/upload-artifact
        with:
          name: windows-smoke-${{ inputs.tag }}
          path: |
            ${{ env.SMOKE_ROOT }}/previous/report.json
            ${{ env.SMOKE_ROOT }}/previous/*.log
            ${{ env.SMOKE_ROOT }}/report.json
            ${{ env.SMOKE_ROOT }}/installer-sha256.json
            ${{ env.SMOKE_ROOT }}/upgrade.json
            ${{ env.SMOKE_ROOT }}/*.log
            ${{ env.SMOKE_ROOT }}/*.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Stop remaining test processes
        if: ${{ always() }}
        shell: pwsh
        run: |
          Get-Process -Name Novy, ollama -ErrorAction SilentlyContinue | Stop-Process -Force
