name: Probe Windows native location phases
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  location-phases:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - name: Disable location on the disposable runner and probe bounded native phases
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $policy = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\LocationAndSensors'
          New-Item -Path $policy -Force | Out-Null
          New-ItemProperty -Path $policy -Name DisableLocation -PropertyType DWord -Value 1 -Force | Out-Null
          $service = Get-Service -Name lfsvc -ErrorAction SilentlyContinue
          if ($service) {
            Stop-Service -Name lfsvc -Force -ErrorAction Stop
            Set-Service -Name lfsvc -StartupType Disabled
          }
          $code = @'
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $WarningPreference = 'SilentlyContinue'
          $clock = [Diagnostics.Stopwatch]::StartNew()
          $watcher = $null
          function Phase([string]$name, [string]$detail = 'none') {
            if ($name -notmatch '^[a-z-]+$' -or $detail -notmatch '^[A-Za-z0-9.+:=-]+$') { return }
            [Console]::Out.WriteLine(('phase={0}|ms={1}|type={2}' -f $name, $clock.ElapsedMilliseconds, $detail))
            [Console]::Out.Flush()
          }
          Phase 'boot' ('PowerShell' + $PSVersionTable.PSVersion.Major + ':' + [Threading.Thread]::CurrentThread.ApartmentState)
          try {
            Phase 'assembly-start'
            Add-Type -AssemblyName System.Device
            Phase 'assembly-ready' 'System.Device.Location.GeoCoordinateWatcher'
            Phase 'constructor-start'
            $watcher = New-Object System.Device.Location.GeoCoordinateWatcher ([System.Device.Location.GeoPositionAccuracy]::Default)
            Phase 'constructor-ready' $watcher.GetType().FullName
            Phase 'try-start' '__DETAIL__'
            $started = $watcher.TryStart(__SUPPRESS__, [TimeSpan]::FromSeconds(__SECONDS__))
            Phase 'try-ready' ('started=' + $started.ToString())
            Phase 'permission-after-start'
            Phase 'permission-after-ready' $watcher.Permission.ToString()
            Phase 'status-after-start'
            Phase 'status-after-ready' $watcher.Status.ToString()
            Phase 'position-unknown-start'
            $unknown = $watcher.Position.Location.IsUnknown
            Phase 'position-unknown-ready' ('unknown=' + $unknown.ToString())
          } catch {
            Phase 'api-error' $_.Exception.GetType().FullName
          } finally {
            if ($null -ne $watcher) {
              try { Phase 'stop-start'; $watcher.Stop(); Phase 'stop-ready' } catch { Phase 'stop-error' $_.Exception.GetType().FullName }
              try { Phase 'dispose-start'; $watcher.Dispose(); Phase 'dispose-ready' } catch { Phase 'dispose-error' $_.Exception.GetType().FullName }
            }
          }
          Phase 'done'
          '@
          foreach ($variant in @('STA-full-true5', 'STA-minimal-true5', 'STA-minimal-false15', 'MTA-minimal-false15')) {
            $pieces = $variant -split '-'
            $apartment = $pieces[0]
            $suppress = if ($pieces[2] -eq 'true5') { '$true' } else { '$false' }
            $seconds = if ($pieces[2] -eq 'true5') { '5' } else { '15' }
            $detail = 'suppressPrompt=' + $suppress.TrimStart('$') + ':timeoutSeconds=' + $seconds
            $variantCode = $code.Replace('__SUPPRESS__', $suppress).Replace('__SECONDS__', $seconds).Replace('__DETAIL__', $detail)
            $encoded = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($variantCode))
            $start = [Diagnostics.ProcessStartInfo]::new()
            $start.FileName = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
            $start.Arguments = '-NoLogo -NoProfile -NonInteractive -' + $apartment + ' -EncodedCommand ' + $encoded
            $start.UseShellExecute = $false
            if ($pieces[1] -eq 'minimal') {
              $start.Environment.Clear()
              $start.Environment['SystemRoot'] = $env:SystemRoot
              $start.Environment['WINDIR'] = $env:SystemRoot
              $start.Environment['TEMP'] = $env:TEMP
              $start.Environment['TMP'] = $env:TMP
            }
            $start.CreateNoWindow = $true
            $start.RedirectStandardOutput = $true
            $start.RedirectStandardError = $true
            $process = [Diagnostics.Process]::new()
            $process.StartInfo = $start
            $clock = [Diagnostics.Stopwatch]::StartNew()
            [void]$process.Start()
            $outTask = $process.StandardOutput.ReadToEndAsync()
            $errTask = $process.StandardError.ReadToEndAsync()
            $finished = $process.WaitForExit(30000)
            if (-not $finished) { $process.Kill($true); $process.WaitForExit(5000) | Out-Null }
            $output = $outTask.GetAwaiter().GetResult()
            $errors = $errTask.GetAwaiter().GetResult()
            Write-Output ('probe={0}|phase=process-end|ms={1}|type=finished:{2}:exit:{3}' -f $variant, $clock.ElapsedMilliseconds, $finished, $process.ExitCode)
            foreach ($line in ($output -split "`r?`n")) {
              if ($line -match '^phase=[a-z-]+\|ms=[0-9]+\|type=[A-Za-z0-9.+:=-]+$') { Write-Output ('probe=' + $variant + '|' + $line) }
            }
            if ($errors.Length -gt 0) { Write-Output ('probe=' + $variant + '|phase=stderr|ms=0|type=present') }
            $process.Dispose()
          }
